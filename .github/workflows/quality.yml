name: Iser quality checks

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install UI test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test guide interactions and accessibility
        run: npm run test:ui
      - name: Test fixture identity and Dutch start times
        run: node scripts/test-football-integrity.mjs
      - name: Test football selection
        run: node scripts/test-football-selection.mjs
      - name: Test search and competition filters
        run: node scripts/test-search.mjs
      - name: Test past-day navigation and data queries
        run: node scripts/test-past-days.mjs
      - name: Test darts and F1 details
        run: node scripts/test-sport-details.mjs
      - name: Test standings and menu persistence
        run: node scripts/test-standings.cjs
      - name: Check public files for credentials
        run: node scripts/test-public-security.mjs

